<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Acme Test App - Account</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        nav { background: #1a1a2e; padding: 1rem 2rem; display: flex; gap: 1.5rem; }
        nav a { color: #fff; text-decoration: none; }
        .container { max-width: 600px; margin: 2rem auto; padding: 1rem; }
        .btn-danger { background: #dc3545; color: white; padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html"><strong>Acme QA</strong></a>
        <a href="catalog.html">Catalog</a>
        <a href="account.html">Account</a>
    </nav>
    <div class="container">
        <h2>User Account</h2>
        <p>Logged in as: <strong>qa_tester@acme.corp</strong></p>
        <!-- Defect-008: Logout button causes unhandled promise rejection -->
        <button id="logout-btn" class="btn-danger">Sign Out</button>
    </div>
    <script>
        document.getElementById('logout-btn').addEventListener('click', function() {
            // Defect-008: Unhandled promise rejection
            new Promise((_, reject) => {
                setTimeout(() => reject(new Error("UnhandledPromiseRejection: Logout service unreachable")), 10);
            });
        });
    </script>
</body>
</html>
