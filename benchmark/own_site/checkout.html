<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Acme Test App - Checkout</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        nav { background: #1a1a2e; padding: 1rem 2rem; display: flex; gap: 1.5rem; }
        nav a { color: #fff; text-decoration: none; }
        .container { max-width: 600px; margin: 2rem auto; padding: 1rem; position: relative; }
        button#place-order-btn { background: #28a745; color: white; padding: 1rem 2rem; border: none; border-radius: 4px; font-size: 1.1rem; cursor: pointer; }
        /* Defect-006: Invisible backdrop overlay covers checkout button with high z-index */
        .invisible-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 999;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html"><strong>Acme QA</strong></a>
        <a href="catalog.html">Catalog</a>
        <a href="cart.html">Cart</a>
        <a href="checkout.html">Checkout</a>
    </nav>
    <div class="container">
        <h2>Order Confirmation</h2>
        <p>Review items and place your order.</p>
        <button id="place-order-btn">Place Order</button>
        <!-- Defect-006: Invisible overlay intercepts clicks -->
        <div class="invisible-overlay" id="blocking-overlay"></div>
    </div>
    <script>
        document.getElementById('place-order-btn').addEventListener('click', function() {
            alert('Order placed successfully!');
        });
    </script>
</body>
</html>
