<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Acme Test App - Shopping Cart</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        nav { background: #1a1a2e; padding: 1rem 2rem; display: flex; gap: 1.5rem; }
        nav a { color: #fff; text-decoration: none; }
        .container { max-width: 600px; margin: 2rem auto; padding: 1rem; border: 1px solid #ccc; border-radius: 6px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid #eee; }
        .qty-controls { display: flex; align-items: center; gap: 0.5rem; }
        .qty-controls button { width: 30px; height: 30px; font-size: 1.1rem; }
        .summary { margin-top: 1.5rem; text-align: right; }
        .promo-section { margin-top: 1rem; display: flex; gap: 0.5rem; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html"><strong>Acme QA</strong></a>
        <a href="catalog.html">Catalog</a>
        <a href="cart.html">Cart</a>
        <a href="checkout.html">Checkout</a>
    </nav>
    <div class="container">
        <h2>Your Cart</h2>
        <div class="cart-item">
            <div>
                <h4>Acme Widget Pro</h4>
                <p>Price: $50.00</p>
            </div>
            <div class="qty-controls">
                <!-- Defect-004: Decrement allows negative numbers -->
                <button id="decrement-qty">-</button>
                <span id="qty-val">1</span>
                <button id="increment-qty">+</button>
            </div>
        </div>
        <div class="promo-section">
            <input type="text" id="promo-code" placeholder="Enter promo code (SAVE20)">
            <button id="apply-promo-btn">Apply Promo</button>
        </div>
        <div class="summary">
            <h3>Cart Total: $<span id="cart-total">50.00</span></h3>
            <h4>Total Payable: $<span id="total-amount">50.00</span></h4>
        </div>
    </div>
    <script>
        let qty = 1;
        const itemPrice = 50.00;
        let total = 50.00;

        function updateCart() {
            document.getElementById('qty-val').innerText = qty;
            const itemTotal = qty * itemPrice;
            document.getElementById('cart-total').innerText = itemTotal.toFixed(2);
            document.getElementById('total-amount').innerText = total.toFixed(2);
        }

        document.getElementById('decrement-qty').addEventListener('click', function() {
            // Defect-004: Decrements without checking bounds (can go below 0)
            qty--;
            total = qty * itemPrice;
            updateCart();
        });

        document.getElementById('increment-qty').addEventListener('click', function() {
            qty++;
            total = qty * itemPrice;
            updateCart();
        });

        document.getElementById('apply-promo-btn').addEventListener('click', function() {
            const code = document.getElementById('promo-code').value.trim();
            if (code === "SAVE20") {
                // Defect-007 (held-out): Re-applying deducts $20 repeatedly without idempotency check
                total -= 20.00;
                document.getElementById('total-amount').innerText = total.toFixed(2);
            }
        });
    </script>
</body>
</html>
